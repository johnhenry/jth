name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node >=26.0.0 -- test the floor version directly rather
        # than a matrix of now-unsupported older majors.
        node-version: [26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cross-package types/imports resolve through each package's dist/,
      # so the build must precede typecheck and tests.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:unit

      # Every shipped example must run cleanly through the built CLI.
      - name: Examples smoke
        run: npm run examples
